<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Georgia, serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9db4c9"/>
      <stop offset="0.45" stop-color="#d9c9a8"/>
      <stop offset="0.75" stop-color="#eec37a"/>
      <stop offset="1" stop-color="#f2b25c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d0" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#ffd98a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fieldFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b99a52"/>
      <stop offset="1" stop-color="#a98a46"/>
    </linearGradient>
    <linearGradient id="fieldMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a855"/>
      <stop offset="1" stop-color="#b08f42"/>
    </linearGradient>
    <linearGradient id="fieldNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8a3e"/>
      <stop offset="1" stop-color="#6e7232"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e3b26"/>
      <stop offset="1" stop-color="#4e2a1a"/>
    </linearGradient>
    <radialGradient id="winGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc766" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffc766" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Himmel -->
  <rect width="1200" height="560" fill="url(#sky)"/>
  <circle cx="930" cy="330" r="230" fill="url(#sun)"/>
  <circle cx="930" cy="330" r="46" fill="#fff0c2"/>
  <!-- Wolken -->
  <g fill="#f4e6c6" opacity="0.85">
    <ellipse cx="240" cy="130" rx="110" ry="22"/>
    <ellipse cx="320" cy="112" rx="70" ry="16"/>
    <ellipse cx="640" cy="90" rx="90" ry="17"/>
    <ellipse cx="1060" cy="150" rx="80" ry="14" opacity="0.7"/>
  </g>
  <!-- Voegel -->
  <g stroke="#5a4a33" stroke-width="2.4" fill="none" opacity="0.8">
    <path d="M 500 150 q 9 -9 18 0 q 9 -9 18 0"/>
    <path d="M 560 176 q 7 -7 14 0 q 7 -7 14 0"/>
    <path d="M 452 190 q 6 -6 12 0 q 6 -6 12 0"/>
  </g>

  <!-- ferne Baumreihe -->
  <g fill="#7b6a3a">
    <ellipse cx="80" cy="552" rx="70" ry="26"/>
    <ellipse cx="190" cy="548" rx="55" ry="22"/>
    <ellipse cx="1130" cy="550" rx="80" ry="26"/>
    <ellipse cx="1010" cy="554" rx="50" ry="18"/>
  </g>

  <!-- Felder in Bahnen -->
  <rect y="560" width="1200" height="80" fill="url(#fieldFar)"/>
  <path d="M 0 640 L 1200 628 L 1200 730 L 0 744 Z" fill="url(#fieldMid)"/>
  <path d="M 0 744 L 1200 730 L 1200 900 L 0 900 Z" fill="url(#fieldNear)"/>
  <!-- Stoppel- und Halmstriche -->
  <g stroke="#9a7c35" stroke-width="2" opacity="0.55">
    <line x1="60" y1="662" x2="52" y2="682"/><line x1="140" y1="668" x2="132" y2="688"/>
    <line x1="230" y1="658" x2="222" y2="678"/><line x1="320" y1="672" x2="312" y2="692"/>
    <line x1="700" y1="664" x2="692" y2="684"/><line x1="800" y1="672" x2="792" y2="692"/>
    <line x1="900" y1="660" x2="892" y2="680"/><line x1="1060" y1="668" x2="1052" y2="688"/>
  </g>
  <g stroke="#5c6128" stroke-width="2.4" opacity="0.6">
    <line x1="100" y1="800" x2="88" y2="832"/><line x1="200" y1="820" x2="188" y2="852"/>
    <line x1="320" y1="790" x2="308" y2="822"/><line x1="900" y1="800" x2="888" y2="832"/>
    <line x1="1020" y1="820" x2="1008" y2="852"/><line x1="1120" y1="786" x2="1108" y2="818"/>
  </g>

  <!-- Weg zum Haus -->
  <path d="M 585 900 Q 560 790 596 700 Q 620 640 622 612 L 648 612 Q 652 660 636 710 Q 610 800 650 900 Z" fill="#c9b084"/>
  <path d="M 585 900 Q 560 790 596 700 Q 620 640 622 612 L 632 612 Q 626 660 614 712 Q 592 800 618 900 Z" fill="#bda172" opacity="0.7"/>

  <!-- Baum am Haus -->
  <g>
    <rect x="802" y="470" width="18" height="130" fill="#5a3a22"/>
    <path d="M 806 500 q -40 -10 -52 -44" stroke="#5a3a22" stroke-width="10" fill="none"/>
    <ellipse cx="812" cy="420" rx="92" ry="64" fill="#6f7a36"/>
    <ellipse cx="756" cy="448" rx="52" ry="38" fill="#7d8a3e"/>
    <ellipse cx="872" cy="452" rx="48" ry="34" fill="#64702f"/>
  </g>

  <!-- Haus -->
  <g>
    <!-- Schornstein + Rauch: heute wird gebacken -->
    <rect x="560" y="330" width="34" height="80" fill="#7a5436"/>
    <g fill="#efe8da" opacity="0.8">
      <ellipse cx="580" cy="306" rx="16" ry="10"/>
      <ellipse cx="596" cy="280" rx="20" ry="12" opacity="0.7"/>
      <ellipse cx="620" cy="252" rx="26" ry="14" opacity="0.55"/>
      <ellipse cx="652" cy="222" rx="32" ry="16" opacity="0.4"/>
    </g>
    <!-- Dach -->
    <path d="M 420 480 L 610 358 L 800 480 Z" fill="url(#roof)"/>
    <path d="M 420 480 L 610 358 L 626 368 L 452 480 Z" fill="#7d4a2e" opacity="0.8"/>
    <!-- Wand -->
    <rect x="448" y="480" width="324" height="150" fill="#e8dcc2"/>
    <rect x="448" y="480" width="324" height="10" fill="#c9b894"/>
    <!-- Giebelfenster oben: das Fenster nebenan -->
    <rect x="586" y="408" width="48" height="44" rx="4" fill="#f5d98a" stroke="#6e4a2a" stroke-width="4"/>
    <line x1="610" y1="410" x2="610" y2="450" stroke="#6e4a2a" stroke-width="3"/>
    <line x1="588" y1="430" x2="632" y2="430" stroke="#6e4a2a" stroke-width="3"/>
    <!-- Kuechenfenster, warm erleuchtet: Zimt in der Luft -->
    <ellipse cx="700" cy="545" rx="60" ry="42" fill="url(#winGlow)"/>
    <rect x="668" y="516" width="64" height="56" rx="4" fill="#ffd98a" stroke="#6e4a2a" stroke-width="5"/>
    <line x1="700" y1="518" x2="700" y2="570" stroke="#6e4a2a" stroke-width="4"/>
    <line x1="670" y1="544" x2="730" y2="544" stroke="#6e4a2a" stroke-width="4"/>
    <!-- Blumenkasten -->
    <rect x="662" y="572" width="76" height="12" rx="3" fill="#7a5436"/>
    <g fill="#b85a3a"><circle cx="676" cy="570" r="5"/><circle cx="694" cy="568" r="5"/><circle cx="712" cy="570" r="5"/><circle cx="728" cy="568" r="5"/></g>
    <!-- Tuer, einen Spalt offen -->
    <rect x="490" y="520" width="58" height="110" rx="4" fill="#5a3a22"/>
    <rect x="540" y="520" width="10" height="110" fill="#ffca6e"/>
    <circle cx="534" cy="578" r="4" fill="#c9a76a"/>
    <!-- Stufe -->
    <rect x="484" y="630" width="70" height="10" fill="#b8a582"/>
    <!-- Kellerfenster, bernstein: die Werkstatt -->
    <ellipse cx="620" cy="622" rx="40" ry="20" fill="url(#winGlow)"/>
    <rect x="598" y="606" width="44" height="26" rx="3" fill="#f5a93f" stroke="#6e4a2a" stroke-width="4"/>
    <line x1="620" y1="608" x2="620" y2="630" stroke="#6e4a2a" stroke-width="3"/>
  </g>

  <!-- Amira und Tara auf dem Weg -->
  <g fill="#2e241a">
    <path d="M 610 742 q 0 -16 13 -16 q 12 0 13 14 q 10 -2 10 8 q 0 8 -10 8 l -22 0 q -12 0 -4 -14 z"/>
    <path d="M 618 728 l -4 -9 l 7 4 z M 630 727 l 4 -9 l -8 4 z"/>
    <path d="M 646 750 q 10 -4 10 -14" stroke="#2e241a" stroke-width="5" fill="none"/>
  </g>
  <g fill="#4a3a28">
    <path d="M 676 766 q 10 -12 20 -2 q 9 -8 14 2 q 5 10 -6 12 l -24 0 q -10 -2 -4 -12 z"/>
    <path d="M 682 758 l -3 -8 l 6 3 z M 693 757 l 4 -8 l -7 3 z"/>
    <path d="M 706 776 q 12 0 14 -10" stroke="#4a3a28" stroke-width="5" fill="none"/>
  </g>

  <!-- Signatur -->
  <text x="1120" y="872" fill="#5a4a33" font-size="26" font-style="italic" opacity="0.9">F.</text>
</svg>

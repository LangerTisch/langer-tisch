<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Georgia, serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241c13"/>
      <stop offset="0.65" stop-color="#2e2417"/>
      <stop offset="1" stop-color="#1c1510"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2b1b"/>
      <stop offset="1" stop-color="#241a10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc766" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#f5a93f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f5a93f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowSmall" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc766" stop-opacity="0.8"/>
      <stop offset="0.4" stop-color="#f5a93f" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f5a93f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc766" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffc766" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="tabletop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3f23"/>
      <stop offset="0.45" stop-color="#8a6233"/>
      <stop offset="0.6" stop-color="#9a7038"/>
      <stop offset="1" stop-color="#4e3720"/>
    </linearGradient>
    <linearGradient id="doorlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8a84e" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#e8a84e" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Raum -->
  <rect width="1200" height="900" fill="url(#wall)"/>
  <rect y="640" width="1200" height="260" fill="url(#floor)"/>
  <g stroke="#17110b" stroke-width="2" opacity="0.5">
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="0" y1="760" x2="1200" y2="760"/>
    <line x1="0" y1="830" x2="1200" y2="830"/>
  </g>
  <!-- Deckenbalken -->
  <rect x="0" y="0" width="1200" height="36" fill="#1a130c"/>
  <rect x="300" y="0" width="26" height="640" fill="#1f1810" opacity="0.35"/>
  <rect x="880" y="0" width="26" height="640" fill="#1f1810" opacity="0.35"/>

  <!-- Kellerfenster, hoch, Nacht draussen -->
  <g>
    <rect x="955" y="70" width="150" height="86" rx="6" fill="#0e1524" stroke="#171108" stroke-width="7"/>
    <line x1="1030" y1="72" x2="1030" y2="156" stroke="#171108" stroke-width="6"/>
    <line x1="957" y1="113" x2="1105" y2="113" stroke="#171108" stroke-width="6"/>
    <circle cx="1077" cy="92" r="7" fill="#e9e4d2" opacity="0.85"/>
    <circle cx="988" cy="100" r="1.6" fill="#cfd8ea" opacity="0.8"/>
    <circle cx="1006" cy="84" r="1.3" fill="#cfd8ea" opacity="0.7"/>
    <circle cx="1056" cy="128" r="1.3" fill="#cfd8ea" opacity="0.6"/>
  </g>

  <!-- Buecherregal links -->
  <g>
    <rect x="40" y="150" width="240" height="500" fill="#241a0f" stroke="#171008" stroke-width="6"/>
    <g stroke="#171008" stroke-width="5">
      <line x1="42" y1="270" x2="278" y2="270"/>
      <line x1="42" y1="390" x2="278" y2="390"/>
      <line x1="42" y1="510" x2="278" y2="510"/>
    </g>
    <!-- Buchruecken, Reihe 1 -->
    <g>
      <rect x="58" y="185" width="22" height="82" fill="#5b3a22"/>
      <rect x="84" y="178" width="18" height="89" fill="#2f4030"/>
      <rect x="106" y="192" width="26" height="75" fill="#6e4a26"/>
      <rect x="136" y="182" width="16" height="85" fill="#7d5a2e"/>
      <rect x="156" y="190" width="24" height="77" fill="#403020"/>
      <rect x="184" y="179" width="20" height="88" fill="#2f4030"/>
      <rect x="208" y="193" width="28" height="74" fill="#5b3a22"/>
      <rect x="240" y="185" width="18" height="82" fill="#8a632f"/>
    </g>
    <!-- Reihe 2 -->
    <g>
      <rect x="58" y="305" width="26" height="82" fill="#2f4030"/>
      <rect x="88" y="312" width="18" height="75" fill="#6e4a26"/>
      <rect x="110" y="300" width="22" height="87" fill="#403020"/>
      <rect x="136" y="315" width="30" height="72" fill="#5b3a22"/>
      <rect x="170" y="302" width="16" height="85" fill="#8a632f"/>
      <rect x="190" y="310" width="24" height="77" fill="#2f4030"/>
      <rect x="218" y="304" width="20" height="83" fill="#6e4a26"/>
      <rect x="242" y="314" width="16" height="73" fill="#403020"/>
    </g>
    <!-- Reihe 3: liegende Chroniken + Bernsteinglas -->
    <g>
      <rect x="60" y="470" width="110" height="14" fill="#5b3a22"/>
      <rect x="66" y="454" width="98" height="14" fill="#2f4030"/>
      <rect x="72" y="438" width="86" height="14" fill="#6e4a26"/>
      <ellipse cx="225" cy="488" rx="26" ry="8" fill="#1d150c"/>
      <path d="M 203 488 q 0 -40 22 -40 q 22 0 22 40 z" fill="#c07b2a" opacity="0.85"/>
      <circle cx="225" cy="466" r="7" fill="#ffc766" opacity="0.55"/>
    </g>
    <!-- Reihe 4: Register, stehend, beschriftet -->
    <g>
      <rect x="58" y="528" width="34" height="112" fill="#403020"/>
      <rect x="96" y="528" width="34" height="112" fill="#2f4030"/>
      <rect x="134" y="528" width="34" height="112" fill="#5b3a22"/>
      <rect x="172" y="528" width="34" height="112" fill="#403020"/>
      <rect x="210" y="528" width="34" height="112" fill="#2f4030"/>
      <g fill="#c9a76a" font-size="13" opacity="0.8">
        <text x="75" y="600" transform="rotate(-90 75 600)">REGISTER</text>
        <text x="113" y="598" transform="rotate(-90 113 598)">CHRONIK</text>
        <text x="151" y="603" transform="rotate(-90 151 603)">REZEPTE</text>
      </g>
    </g>
  </g>

  <!-- Lampe + Licht -->
  <line x1="600" y1="36" x2="600" y2="160" stroke="#0f0b06" stroke-width="5"/>
  <path d="M 545 160 L 655 160 L 625 205 L 575 205 Z" fill="#3a2c18" stroke="#17110b" stroke-width="3"/>
  <ellipse cx="600" cy="208" rx="26" ry="12" fill="#ffc766"/>
  <ellipse cx="600" cy="320" rx="330" ry="230" fill="url(#glow)"/>
  <path d="M 575 210 L 625 210 L 905 640 L 295 640 Z" fill="url(#cone)"/>

  <!-- Langer Tisch -->
  <g>
    <rect x="210" y="560" width="700" height="26" rx="4" fill="url(#tabletop)"/>
    <rect x="210" y="586" width="700" height="12" fill="#3a2a17"/>
    <rect x="240" y="598" width="20" height="150" fill="#332413"/>
    <rect x="850" y="598" width="20" height="150" fill="#332413"/>
    <rect x="540" y="598" width="16" height="146" fill="#2c1f10" opacity="0.8"/>
  </g>

  <!-- Blaetter des Tages, juengstes zuoberst -->
  <g>
    <rect x="300" y="536" width="120" height="26" rx="2" fill="#cdbd9a" transform="rotate(-4 360 549)"/>
    <rect x="312" y="530" width="120" height="26" rx="2" fill="#dccfae" transform="rotate(2 372 543)"/>
    <rect x="322" y="524" width="120" height="26" rx="2" fill="#efe3c4" transform="rotate(-1 382 537)"/>
    <g stroke="#8a7a56" stroke-width="1.6" opacity="0.8">
      <line x1="338" y1="532" x2="424" y2="530"/>
      <line x1="338" y1="538" x2="416" y2="536"/>
      <line x1="338" y1="544" x2="428" y2="542"/>
    </g>
  </g>

  <!-- Aufgeschlagenes Registerbuch -->
  <g>
    <path d="M 630 556 q 55 -16 110 0 l 0 10 q -55 -14 -110 0 z" fill="#efe6cc" stroke="#9a8a62" stroke-width="2"/>
    <line x1="685" y1="541" x2="685" y2="563" stroke="#9a8a62" stroke-width="2"/>
    <g stroke="#a09066" stroke-width="1.4" opacity="0.9">
      <line x1="642" y1="549" x2="676" y2="546"/>
      <line x1="642" y1="554" x2="676" y2="551"/>
      <line x1="694" y1="546" x2="728" y2="549"/>
      <line x1="694" y1="551" x2="728" y2="554"/>
    </g>
  </g>
  <!-- Tintenfass + abgelegte Brille -->
  <rect x="770" y="544" width="22" height="18" rx="3" fill="#1d150c"/>
  <ellipse cx="781" cy="544" rx="11" ry="4" fill="#0f0b06"/>
  <g stroke="#c9b68a" stroke-width="2.6" fill="none" opacity="0.95">
    <circle cx="742" cy="552" r="7.5"/>
    <circle cx="762" cy="552" r="7.5"/>
    <path d="M 749.5 552 q 6 -4 12 0"/>
  </g>

  <!-- Figur bei der Arbeit, Dreiviertel von hinten -->
  <g>
    <!-- Stuhl -->
    <rect x="462" y="620" width="96" height="14" rx="4" fill="#332413"/>
    <rect x="470" y="634" width="14" height="112" fill="#2c1f10"/>
    <rect x="536" y="634" width="14" height="112" fill="#2c1f10"/>
    <!-- Koerper: eher hoch als breit, dunkles Gruen -->
    <path d="M 468 626 q -10 -96 22 -138 q 20 -24 44 -16 q 26 10 30 44 q 4 46 -6 110 z" fill="#31452f"/>
    <path d="M 468 626 q -10 -96 22 -138 q 10 -12 22 -15 l 0 153 z" fill="#263a26" opacity="0.8"/>
    <!-- rechter Arm zum Blatt -->
    <path d="M 548 512 q 36 18 52 44 q 6 10 -4 14 q -10 4 -16 -4 q -18 -24 -44 -36 z" fill="#31452f"/>
    <path d="M 592 560 q 10 2 14 8 l 14 -6 q -6 -10 -16 -12 z" fill="#caa36d"/>
    <!-- Feder in der Hand -->
    <path d="M 614 556 L 648 522 q 4 -4 6 0 q 2 4 -2 8 L 620 562 Z" fill="#d8c9a2"/>
    <!-- Kragen -->
    <path d="M 498 486 q 18 -10 36 0 l -4 14 q -14 -8 -28 0 z" fill="#263a26"/>
    <!-- Kopf, leicht geneigt: Haar hinten, Gesicht zum Blatt -->
    <ellipse cx="515" cy="453" rx="32" ry="34" fill="#241f1a"/>
    <ellipse cx="523" cy="464" rx="25" ry="28" fill="#caa36d"/>
    <!-- ergrauter Anteil im dunklen Haar -->
    <path d="M 492 434 q 8 -12 18 -15 q 1 7 -4 13 q -8 3 -14 2 z" fill="#8f8a80" opacity="0.9"/>
    <path d="M 500 425 q 10 -6 18 -6 q -1 6 -7 10 q -7 0 -11 -4 z" fill="#6e6a62" opacity="0.6"/>
    <!-- Ohr -->
    <ellipse cx="543" cy="464" rx="5" ry="8" fill="#b8905c"/>
  </g>

  <!-- Hocker neben seinem Platz -->
  <g>
    <ellipse cx="380" cy="648" rx="40" ry="10" fill="#403020"/>
    <rect x="352" y="652" width="10" height="86" fill="#2c1f10"/>
    <rect x="398" y="652" width="10" height="86" fill="#2c1f10"/>
    <rect x="372" y="668" width="18" height="60" fill="#2c1f10" opacity="0.6"/>
  </g>

  <!-- Der niedrigere Sessel + kleine Lampe, die brennt -->
  <g>
    <ellipse cx="1035" cy="700" rx="120" ry="30" fill="url(#glowSmall)"/>
    <rect x="952" y="590" width="116" height="78" rx="16" fill="#4a3522"/>
    <rect x="936" y="628" width="24" height="58" rx="10" fill="#54391f"/>
    <rect x="1060" y="628" width="24" height="58" rx="10" fill="#54391f"/>
    <rect x="954" y="650" width="112" height="28" rx="9" fill="#5d4229"/>
    <rect x="956" y="678" width="108" height="18" fill="#3c2b1a"/>
    <rect x="962" y="696" width="12" height="22" fill="#2c1f10"/>
    <rect x="1046" y="696" width="12" height="22" fill="#2c1f10"/>
    <!-- Stehlampe daneben, an - gerade wenn sie nicht da ist -->
    <rect x="1118" y="560" width="7" height="170" fill="#1d150c"/>
    <path d="M 1096 560 L 1152 560 L 1140 522 L 1108 522 Z" fill="#c07b2a"/>
    <ellipse cx="1124" cy="560" rx="22" ry="8" fill="#ffc766" opacity="0.9"/>
    <ellipse cx="1124" cy="560" rx="60" ry="46" fill="url(#glowSmall)"/>
  </g>

  <!-- Tuer rechts, nie ganz zu -->
  <g>
    <rect x="1152" y="360" width="48" height="340" fill="#17110b"/>
    <rect x="1162" y="368" width="30" height="332" fill="url(#doorlight)"/>
    <rect x="1142" y="352" width="12" height="348" fill="#241a0f"/>
  </g>

  <!-- Signatur -->
  <text x="1138" y="872" fill="#c9a76a" font-size="26" font-style="italic" opacity="0.85">F.</text>
</svg>
